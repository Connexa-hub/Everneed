name: Initialize persistent Android project
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type INITIALIZE_ANDROID to create and commit the native Android project
        required: true
        type: string
permissions:
  contents: write
jobs:
  initialize:
    if: github.ref != 'refs/heads/main' && inputs.confirm == 'INITIALIZE_ANDROID'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Generate Android project (one-time)
        run: npx cap add android
      - name: Apply Everneed native settings
        run: node tools/prepare-android.mjs
      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android
      - name: Confirm project files are present
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/settings.gradle
      - name: Commit native project to selected feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "chore(android): persist Capacitor native project"
          git push origin HEAD:${{ github.ref_name }}
