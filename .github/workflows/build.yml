name: Build Android app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Queue builds for the same branch instead of cancelling an in-progress database test.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Install and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run checks
        run: npm test
      - name: Tokens are up to date
        run: node tools/build-tokens.mjs && git diff --exit-code css/tokens.css
  database:
    name: Database tests
    runs-on: ubuntu-latest
    # Starts a local Supabase stack, applies every migration, then runs the SQL test suite.
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check payment recovery worker
        run: deno check --config supabase/deno.json supabase/functions/payment-recovery/index.ts
      - name: Type-check Paystack checkout and webhook function
        run: deno check --config supabase/deno.json supabase/functions/paystack/index.ts
      - name: Paystack verified attempt-context binding unit tests
        run: deno test --config supabase/deno.json supabase/functions/paystack/payment-context.test.ts
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - run: test -f supabase/config.toml || supabase init
      - run: supabase start -x edge-runtime,logflare,vector,imgproxy,studio,realtime,mailpit
      - name: Apply legacy payment RPC search-path migration (032)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/032_legacy_payment_rpc_search_path.sql
      - name: Variant-aware checkout contract tests (039)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/039_variant_checkout_contract_checks.sql
      - name: Run Phase 2 checks
        shell: bash
        run: |
          set -o pipefail
          set +e
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/phase2_checks.sql 2>&1 | tee /tmp/p2.txt
          psql_status=${PIPESTATUS[0]}
          set -e
          # This test deliberately raises PHASE2 REPORT to roll back its fixtures.
          # psql therefore exits 3 even when every assertion passes; validate both
          # the expected rollback report and zero failures before accepting that exit.
          grep -q "PHASE2 REPORT (rolled back)" /tmp/p2.txt
          grep -Eq 'PASS: [0-9]+  FAIL: 0' /tmp/p2.txt
          test "$psql_status" -eq 3
      - name: Public RPC security regression tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/016_public_rpc_security_hardening.sql
      - name: Authenticated RPC security regression tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/017_authenticated_rpc_security.sql
      - name: Buyer, seller and admin RLS isolation regression tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/018_rls_isolation_regression.sql
      - name: Turnstile public RPC ACL regression tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/019_turnstile_public_rpc_acl.sql
      - name: Payment checkout snapshot structural tests (027)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/027_payment_checkout_snapshot_checks.sql
      - name: Payment attempt RPC security tests (028)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/028_payment_attempt_rpc_checks.sql
      - name: Payment recovery lease and settlement integrity tests (029)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/029_payment_recovery_worker_checks.sql
      - name: Payment recovery worker context tests (030)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/030_payment_recovery_context_checks.sql
      - name: Stale payment-attempt recovery tests (031)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/031_stale_payment_attempt_recovery_checks.sql
      - name: Legacy payment RPC search-path tests (032)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/032_legacy_payment_rpc_search_path_checks.sql
      - name: Double-entry finance journal tests (033)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/033_double_entry_finance_journal_checks.sql
      - name: Finance journal input hardening tests (034)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/034_finance_journal_input_hardening_checks.sql
      - name: FIN-02A deterministic financial allocation tests (035)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/035_fin02a_allocation_math_checks.sql
      - name: FIN-02A offer funding consent and campaign budget tests (040)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/040_fin02a_offer_funding_controls_checks.sql
      - name: FIN-02A immutable financial snapshot v2 storage tests (041)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/041_fin02a_snapshot_v2_storage_checks.sql
      - name: FIN-02A store allocation totals validation tests (042)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/042_fin02a_store_totals_validation_checks.sql
      - name: FIN-02A funding RPC least-privilege ACL tests (043)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/043_fin02a_rpc_acl_tightening_checks.sql
      - name: FIN-02A consent audit actor attribution tests (044)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/044_fin02a_consent_audit_actor_checks.sql
      - name: FIN-02A v2 checkout builder integration tests (045)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/045_fin02a_checkout_snapshot_builder_checks.sql
      - name: FIN-02A platform and seller-funded snapshot builder fixtures (046)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/046_fin02a_snapshot_builder_integration_fixtures.sql
      - name: FIN-02A campaign reservation lifecycle tests (047)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/047_fin02a_campaign_reservation_lifecycle_checks.sql
      - name: FIN-02A atomic checkout wrapper test (048)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/048_fin02a_atomic_checkout_wrapper_fixture.sql
      - name: FIN-02A snapshot quote identity guard tests (049)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/049_fin02a_snapshot_quote_identity_guard_checks.sql
      - name: FIN-02A card-only checkout wrapper scope test (050)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/050_fin02a_card_checkout_wrapper_scope_checks.sql
      - name: FIN-02A multi-store allocation and minor-unit rounding tests (051)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/051_fin02a_multistore_minor_unit_rounding_checks.sql
      - name: FIN-02A insufficient campaign budget atomic rollback test (052)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/052_fin02a_insufficient_campaign_budget_atomic_rollback.sql
      - name: FIN-02A campaign budget over-reservation guard test (053)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/053_fin02a_campaign_budget_overreservation_guard.sql
      - name: FIN-02A concurrent campaign budget reservation test (054)
        run: bash supabase/tests/054_fin02a_campaign_budget_concurrency.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      - name: FIN-02A FX quote and currency exponent contract test (055)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/055_fin02a_fx_quote_currency_exponent_contract.sql
      - name: FIN-02A unpaid checkout expiry safety tests (056)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/056_fin02a_unpaid_checkout_expiry_worker_checks.sql
      - name: FIN-03 verified settlement lifecycle tests (057)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/057_fin03_verified_settlement_lifecycle_checks.sql
      - name: Seller onboarding, plan entitlement and quota tests (034)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/034_seller_onboarding_entitlements_and_quotas_checks.sql

      - name: Seller message notification contract tests (036)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/036_seller_message_notification_contract_checks.sql
      - name: Seller notification trigger ACL tests (037)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/037_chat_notification_trigger_acl_checks.sql

      - name: Product catalogue foundation regression tests (038)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/038_product_catalog_foundation_checks.sql
      - name: Anonymous reads
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/anon_smoke.sql
  # TEMPORARILY PAUSED: web-only development; do not build Android APKs until requested.
  apk:
    if: false
    needs: [test, database]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check scripts and data
        run: |
          for f in js/*.js; do node --check "$f"; done
          for f in data/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done
      - run: npm install
      - name: Prepare app files
        run: |
          mkdir www
          cp -r index.html favicon.svg favicon.png css js data fonts www/
          # Stamp the real build into the app so Settings and Appearance show which build is installed.
          echo "window.BUILD={n:${{ github.run_number }},sha:\"${GITHUB_SHA::7}\",branch:\"${{ github.ref_name }}\"};" > www/js/build.js
          echo "window.buildLabel=function(){var b=window.BUILD||{};return\"Build \"+b.n+\" \\u00B7 \"+b.sha+\" \\u00B7 \"+b.branch};" >> www/js/build.js
      - run: npx cap add android
      - name: Allow camera and microphone
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application|' $M
      - name: Add the AdMob app id
        run: |
          ID=$(node -e "global.window=global;require('./js/config.js');console.log(CFG.ads.appId)")
          M=android/app/src/main/AndroidManifest.xml
          sed -i "s|</application>|    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ID\"/>\n    </application>|" $M
          grep -q "com.google.android.gms.ads.APPLICATION_ID" $M
      - name: Generate app icons and splash screens
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f6b4f' --iconBackgroundColorDark '#0f6b4f' --splashBackgroundColor '#fafaf8' --splashBackgroundColorDark '#0d0f0e'
      - name: Number the build so each one installs over the last
        run: |
          # versionCode is minutes since 1970, so it always beats an older install, even from a different repository whose run numbers were higher.
          VC=$(( $(date +%s) / 60 ))
          sed -i "s/versionCode 1/versionCode $VC/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Install the protected Android signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || { echo "::error::Add ANDROID_DEBUG_KEYSTORE_BASE64 in GitHub Actions secrets before building APKs."; exit 1; }
          mkdir -p ~/.android
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
      - run: npx cap sync android
      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: everneed-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # The Actions artifact is the reliable APK download; no Release-write permission is needed.
      - name: Where to find the APK
        run: |
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: \`${{ github.ref_name }}\`, build ${{ github.run_number }}." >> "$GITHUB_STEP_SUMMARY"
          echo "- Or this run's Artifacts section: **everneed-apk**." >> "$GITHUB_STEP_SUMMARY"

