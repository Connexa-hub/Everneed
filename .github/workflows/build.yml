name: Build Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check scripts and data
        run: |
          for f in js/*.js; do node --check "$f"; done
          for f in data/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done
      - run: npm install
      - name: Prepare app files
        run: |
          mkdir www
          cp -r index.html css js data www/
      - run: npx cap add android
      - name: Allow camera and microphone
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application|' $M
      - run: npx cap sync android
      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: everneed-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
