name: Migration files

# The Supabase CLI applies only files named <digits>_<name>.sql.
# Keep this exact list aligned with the version order in the live migration history.

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrations-check.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  names:
    name: Names and order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every file is named digits_name.sql
        shell: bash
        run: |
          set -euo pipefail
          for f in supabase/migrations/*; do
            n=$(basename "$f")
            if [[ ! "$n" =~ ^[0-9]+_[A-Za-z0-9_]+\.sql$ ]]; then
              echo "::error file=$f::The Supabase CLI would skip this file. Use digits, an underscore, a name, then .sql."
              exit 1
            fi
          done

      - name: No two files share a version
        shell: bash
        run: |
          set -euo pipefail
          dupes=$(ls supabase/migrations | sed -E 's/^([0-9]+)_.*/\1/' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration versions: $dupes"
            exit 1
          fi
          echo "No duplicate versions."

      - name: Replay order is the order recorded in the docs
        shell: bash
        run: |
          set -euo pipefail
          expected="000_baseline.sql 001_remove_cj.sql 002_hotfix.sql 0020_multivendor_foundation.sql 0021_multivendor_function_grants_hardening.sql 003_remove_unrecorded_multivendor.sql 0030_signup_profile_fields.sql 004_marketplace_core.sql 005_marketplace_backfill_guards.sql 006_marketplace_rls.sql 007_marketplace_functions.sql 008_hardening.sql 009_profile_settings.sql 010_seller_helpers.sql 011_plans_and_limits.sql 012_support_chat_and_waitlist.sql 013_support_chat_hardening.sql 014_chat_start_official_store.sql 015_support_sla_public.sql 016_public_rpc_security_hardening.sql 017_authenticated_rpc_boundary_hardening.sql 018_turnstile_public_rpc_boundary.sql 019_regional_policy_and_store_verification_gate.sql"
          actual=$(for f in supabase/migrations/*.sql; do basename "$f"; done | awk -F_ '{print $1 " " $0}' | LC_ALL=C sort | cut -d' ' -f2- | paste -sd' ' -)
          if [ "$actual" != "$expected" ]; then
            echo "::error::The complete migration directory must contain the 19 recovered historical migrations followed by the pending hardening migrations 016–019 in recorded order (no missing or extra files)."
            echo "expected: $expected"
            echo "actual:   $actual"
            exit 1
          fi
          echo "Order matches the live history."
