name: Migration files

# The Supabase CLI applies only files named <digits>_<name>.sql.
# Keep this exact list aligned with the version order in the live migration history.

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrations-check.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  names:
    name: Names and order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every file is named digits_name.sql
        shell: bash
        run: |
          set -euo pipefail
          for f in supabase/migrations/*; do
            n=$(basename "$f")
            if [[ ! "$n" =~ ^[0-9]+_[A-Za-z0-9_]+\.sql$ ]]; then
              echo "::error file=$f::The Supabase CLI would skip this file. Use digits, an underscore, a name, then .sql."
              exit 1
            fi
          done

      - name: No two files share a version
        shell: bash
        run: |
          set -euo pipefail
          dupes=$(ls supabase/migrations | sed -E 's/^([0-9]+)_.*/\1/' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration versions: $dupes"
            exit 1
          fi
          echo "No duplicate versions."

      - name: Replay order is the order recorded in the docs
        shell: bash
        run: |
          set -euo pipefail
          expected="000_baseline.sql 001_remove_cj.sql 002_hotfix.sql 0020_multivendor_foundation.sql 0021_multivendor_function_grants_hardening.sql 003_remove_unrecorded_multivendor.sql 0030_signup_profile_fields.sql 004_marketplace_core.sql 005_marketplace_backfill_guards.sql 006_marketplace_rls.sql 007_marketplace_functions.sql 008_hardening.sql 009_profile_settings.sql 010_seller_helpers.sql 011_plans_and_limits.sql 012_support_chat_and_waitlist.sql 013_support_chat_hardening.sql 014_chat_start_official_store.sql 015_support_sla_public.sql 016_public_rpc_security_hardening.sql 017_authenticated_rpc_boundary_hardening.sql 018_turnstile_public_rpc_boundary.sql 019_regional_policy_and_store_verification_gate.sql 020_regional_policy_rls_and_approval_hardening.sql 021_policy_document_public_read_hardening.sql 022_require_latest_seller_policy_acceptance.sql 023_seed_managed_seller_categories.sql 024_storefront_public_details.sql 025_storefront_details_seller_grant.sql 026_payment_lifecycle.sql 027_payment_checkout_snapshot.sql 028_payment_attempt_rpc.sql 029_payment_recovery_worker.sql 030_payment_recovery_context.sql 031_stale_payment_attempt_recovery.sql 032_legacy_payment_rpc_search_path.sql 033_double_entry_finance_journal.sql 034_finance_journal_input_hardening.sql 035_fin02a_allocation_math.sql 036_fin02a_offer_funding_controls.sql 037_fin02a_funding_audit_events.sql 038_fin02a_snapshot_v2_storage.sql 039_fin02a_store_totals_validation.sql 040_fin02a_rpc_acl_tightening.sql 041_fin02a_consent_audit_actor.sql 042_fin02a_snapshot_builder_checkout_integration.sql 043_fin02a_campaign_reservation_lifecycle.sql 20261116201132_seller_onboarding_entitlements_and_quotas.sql 20261116201843_seller_product_quota_trigger_privilege_fix.sql 20261116233544_free_entry_defaults_and_trial_assignment.sql 20261116233953_ng_seller_checks_commercial_tier_activation.sql 20261117054738_plan_selection_approval_and_seller_catalog.sql 20261117074652_ninja_hosted_verification_foundation.sql 20261117074714_ninja_provider_verification_composite_dedupe.sql 20261117074747_ninja_webhook_event_api_storage.sql 20261117074852_ninja_verification_review_status.sql 20261117074929_remove_private_ninja_event_duplicate.sql 20261117103428_remove_legacy_verification_provider_artifacts.sql 20261119024723_seller_message_notification_contract.sql 20261119024825_chat_notification_trigger_acl.sql 20261119030341_product_catalog_foundation.sql 20261119030531_catalog_taxonomy_and_publish_schedule_hardening.sql 20261119030757_admin_store_workspace_context.sql 20261119030905_inventory_movement_reference_and_legacy_stock_audit.sql 20261119031033_product_editor_mode_entitlement.sql 20261119031258_product_catalog_trigger_acl_hardening.sql 20261119042700_variant_checkout_inventory.sql 20261119042710_official_store_live_entitlement_bypass.sql 20261119122500_seller_product_quota_guard_security_definer.sql 20261119124500_products_guard_preserve_caller_role.sql 20261119125500_restore_seller_plan_catalog_read_grants.sql 20261119130500_revoke_anonymous_category_schema_rpc.sql"
          actual=$(for f in supabase/migrations/*.sql; do basename "$f"; done | awk -F_ '{print $1 " " $0}' | LC_ALL=C sort | cut -d' ' -f2- | paste -sd' ' -)
          if [ "$actual" != "$expected" ]; then
            echo "::error::The complete migration directory must contain every recorded migration from 000 through the latest recorded staging migration in exact replay order (no missing or extra files)."
            echo "expected: $expected"
            echo "actual:   $actual"
            exit 1
          fi
          echo "Order matches the live history."
