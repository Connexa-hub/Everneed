name: Staging database

# Applies supabase/migrations/ to the STAGING database (Everneed-staging, ref vjiadqygpyebpisxslbx).
# Runs whenever migrations change on web-portal, or by hand from the Actions tab.
# It can never touch the live database: it refuses to run unless the connection string is the staging project.
# One-time setup by the owner: add the repository secret STAGING_DB_URL (see docs/WORKFLOW/ENVIRONMENTS.md).

on:
  push:
    branches: [web-portal]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/staging-db.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-db
  cancel-in-progress: false

env:
  STAGING_REF: vjiadqygpyebpisxslbx
  LIVE_REF: zpgasfweaixwsktlueje

jobs:
  apply:
    name: Apply migrations to staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the secret is set and points at staging
        id: guard
        shell: bash
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          set -uo pipefail
          if [ -z "${STAGING_DB_URL:-}" ]; then
            echo "::notice::STAGING_DB_URL is not set yet, so staging was not updated. See docs/WORKFLOW/ENVIRONMENTS.md."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$STAGING_DB_URL" == *"$LIVE_REF"* ]]; then
            echo "::error::STAGING_DB_URL contains the LIVE project reference. Refusing to run."
            exit 1
          fi
          if [[ "$STAGING_DB_URL" != *"$STAGING_REF"* ]]; then
            echo "::error::STAGING_DB_URL does not contain the staging project reference ($STAGING_REF). Refusing to run."
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.run == 'true'
        with:
          version: latest

      - name: List what is already applied
        if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: supabase migration list --db-url "$STAGING_DB_URL" || true

      - name: Apply pending migrations
        if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: supabase db push --db-url "$STAGING_DB_URL" --include-all --yes

      - name: Show the result
        if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: supabase migration list --db-url "$STAGING_DB_URL"
